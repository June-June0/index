  <style>/* ===================== 小游记 · 全局样式 ===================== */
:root {
  --primary: #ff8fab;
  --primary-dark: #f56a8e;
  --primary-soft: #ffe3ec;
  --accent: #7ad0c1;
  --accent-soft: #e2f6f1;
  --warn: #ffb454;
  --bg: #fff6f9;
  --bg-2: #fdeef4;
  --card: #ffffff;
  --text: #3a3340;
  --text-2: #8a8190;
  --line: #f1e3ea;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 20px rgba(255, 143, 171, 0.16);
  --shadow-sm: 0 3px 10px rgba(180, 150, 170, 0.14);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --header-h: 56px;
  --nav-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { max-width: 100%; display: block; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
ul { margin: 0; padding: 0; list-style: none; }

#app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding-top: var(--safe-t);
}
.app-header__inner { height: var(--header-h); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.app-header__title { font-size: 18px; font-weight: 700; margin: 0; flex: 1; letter-spacing: .5px; }
.app-header__actions { display: flex; gap: 6px; }
.app-header__back { color: #fff; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; }
.app-header__back:active { background: rgba(255,255,255,.18); }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: #fff; }
.icon-btn:active { background: rgba(255,255,255,.2); }
.icon-btn--ghost { background: rgba(255,255,255,.2); }

/* ---------- Main ---------- */
.app-main { flex: 1; padding: 14px 14px calc(var(--nav-h) + var(--safe-b) + 16px); -webkit-overflow-scrolling: touch; }

/* ---------- Bottom Nav ---------- */
.app-nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 40;
  width: 100%; max-width: 480px;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line);
  display: flex;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-2); font-size: 11px; position: relative; }
.nav-item__icon { display: flex; }
.nav-item.active { color: var(--primary-dark); font-weight: 700; }
.nav-item.active .nav-item__icon { transform: translateY(-1px); }
.nav-item.active::before { content: ""; position: absolute; top: 6px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); z-index: -1; }

/* ---------- Cards ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 12px; }
.card--flat { box-shadow: none; border: 1px solid var(--line); }
.section-title { font-size: 16px; font-weight: 700; margin: 4px 0 12px; display: flex; align-items: center; gap: 6px; }
.section-title small { font-weight: 400; color: var(--text-2); font-size: 12px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .08s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn--primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: var(--shadow); }
.btn--accent { background: var(--accent); color: #fff; }
.btn--ghost { background: var(--primary-soft); color: var(--primary-dark); }
.btn--line { background: #fff; border: 1.5px solid var(--primary); color: var(--primary-dark); }
.btn--block { width: 100%; }
.btn--sm { padding: 7px 12px; font-size: 13px; }
.btn--danger { background: #ffe5e5; color: #e2575f; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); left: auto; transform: none; z-index: 35; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 8px 22px rgba(245,106,142,.45); display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; }
.fab:active { transform: scale(.94); }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field__label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%; border: 1.5px solid var(--line); background: #fff;
  border-radius: var(--radius-sm); padding: 11px 12px; outline: none; transition: border-color .2s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
.textarea { resize: vertical; min-height: 70px; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); color: var(--text-2); font-size: 13px; font-weight: 600; }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }

/* ---------- Empty / List ---------- */
.empty { text-align: center; padding: 50px 20px; color: var(--text-2); }
.empty__emoji { font-size: 44px; margin-bottom: 10px; }
.empty__tip { font-size: 13px; margin-top: 6px; }

.trip-card { position: relative; overflow: hidden; cursor: pointer; }
.trip-card__cover { height: 92px; border-radius: 14px; margin: -14px -14px 12px; background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft)); display: flex; align-items: center; justify-content: center; font-size: 40px; }
.trip-card__name { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
.trip-card__meta { color: var(--text-2); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.trip-card__tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--bg-2); color: var(--primary-dark); }
.tag--accent { background: var(--accent-soft); color: #2f9c89; }

.stat-row { display: flex; gap: 10px; }
.stat { flex: 1; background: var(--bg-2); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.stat__num { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
.stat__lbl { font-size: 11px; color: var(--text-2); }

/* ---------- Timeline ---------- */
.day-block { margin-bottom: 18px; }
.day-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.day-head__badge { background: var(--primary); color: #fff; font-weight: 700; border-radius: 10px; padding: 4px 10px; font-size: 13px; }
.day-head__date { color: var(--text-2); font-size: 13px; }

.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--primary-soft), var(--accent-soft)); }
.tl-item { position: relative; margin-bottom: 12px; }
.tl-item__dot { position: absolute; left: -26px; top: 14px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 9px; }
.tl-item__dot--food { border-color: var(--warn); }
.tl-item__dot--transport { border-color: var(--accent); }
.tl-item__dot--hotel { border-color: #9b8cff; }
.tl-item__dot--note { border-color: var(--text-2); }

.item-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; }
.item-card__top { display: flex; align-items: flex-start; gap: 8px; }
.item-card__time { font-weight: 800; color: var(--primary-dark); font-size: 14px; min-width: 46px; }
.item-card__title { font-weight: 700; flex: 1; }
.item-card__type { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); white-space: nowrap; }
.item-card__type--food { background: #fff2dc; color: #c9822a; }
.item-card__type--transport { background: var(--accent-soft); color: #2f9c89; }
.item-card__type--hotel { background: #efeaff; color: #6a5bd1; }
.item-card__type--note { background: #eee; color: var(--text-2); }
.item-card__note { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.item-card__sub { font-size: 12px; color: var(--text-2); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.item-card__photos { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.item-card__photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.item-card__actions { display: flex; gap: 8px; margin-top: 8px; }
.item-card__actions .link { font-size: 12px; color: var(--primary-dark); font-weight: 600; }
.item-card__actions .link--danger { color: #e2575f; }

/* ---------- Map ---------- */
.map-box { width: 100%; height: 260px; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; background: var(--bg-2); position: relative; }
.map-box__placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-2); gap: 8px; text-align: center; padding: 16px; }
.map-box.inited { background: #fff; }
.map-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

    async searchJs(city, keyword) {

/* ===================== 云同步（GitHub Gist） ===================== */
(function (global) {
  'use strict';

  const API = 'https://api.github.com/gists';
  const FNAME = 'xiaoyouji.json';

  function cfg() {
    const s = Store.getSettings();
    return {
      token: (s.syncToken || '').trim(),
      gistId: (s.syncGistId || '').trim()
    };
  }
  // 根据 Token 前缀自动选择认证头：
  //   classic PAT（ghp_...）           →  Authorization: token <tok>
  //   fine-grained PAT（github_pat_...）→  Authorization: Bearer <tok>
  function authHeader(token) {
    const t = (token || '').trim();
    if (t.startsWith('github_pat_')) return 'Bearer ' + t;
    return 'token ' + t;
  }
  function hdrs(token) {
    return {
      'Authorization': authHeader(token),
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github+json'
    };
  }

  // 在用户所有 Gist 中按文件名找到小游记的同步仓库
  async function findGist(token) {
    try {
      const res = await fetch(API, { headers: hdrs(token) });
      if (!res.ok) return null;
      const list = await res.json().catch(() => []);
      const found = (list || []).find(g => g.files && g.files[FNAME]);
      return found ? found.id : null;
    } catch (e) { return null; }
  }

  // 上传本地数据到 Gist（无 gistId 时自动查找已有 / 否则新建）
  async function push() {
    const { token, gistId } = cfg();
    if (!token) throw new Error('请先在同步设置里填写 GitHub Token');
    let id = gistId;
    if (!id) id = await findGist(token);
    const body = JSON.stringify({ files: { [FNAME]: { content: Store.exportJSON() } } });
    let url = API, method = 'POST';
    if (id) { url = API + '/' + id; method = 'PATCH'; }
    const res = await fetch(url, { method, headers: hdrs(token), body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = data.message || res.statusText;
      if (res.status === 401) msg += '。请检查：① Token 是否完整复制（ghp_开头）；② 是否为 Tokens (classic) 且勾选了 gist；③ 是否已被删除/过期。';
      throw new Error('上传失败 (' + res.status + ')：' + msg);
    }
    const newId = data.id || id;
    if (newId && newId !== gistId) Store.saveSettings({ syncGistId: newId });
    Store.saveSettings({ lastSyncAt: Date.now() });
    return newId;
  }

  // 从 Gist 拉取数据覆盖本地（无 gistId 时自动发现）
  async function pull() {
    const { token, gistId } = cfg();
    if (!token) throw new Error('请先在同步设置里填写 GitHub Token');
    let id = gistId;
    if (!id) {
      id = await findGist(token);
      if (!id) throw new Error('还没有同步仓库，请先在一台设备上「上传到云端」一次');
    }
    const res = await fetch(API + '/' + id, { headers: hdrs(token) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = data.message || res.statusText;
      if (res.status === 401) msg += '。请检查：① Token 是否完整复制（ghp_开头）；② 是否为 Tokens (classic) 且勾选了 gist；③ 是否已被删除/过期。';
      throw new Error('拉取失败 (' + res.status + ')：' + msg);
    }
    const file = data.files && data.files[FNAME];
    if (!file || file.content == null) throw new Error('云端还没有小游记数据');
    Store.importJSON(file.content);
    if (id !== gistId) Store.saveSettings({ syncGistId: id });
    Store.saveSettings({ lastSyncAt: Date.now() });
  }

  global.Sync = { push, pull, findGist, cfg };

      const overdue = !lb || (Date.now() - lb > 14 * 864e5);
      if (!overdue) return;
      this._backupNagged = true;
      const days = lb ? Math.floor((Date.now() - lb) / 864e5) : null;
      const head = lb ? ('你已有 ' + days + ' 天没备份了') : '你还没备份过';
      const banner = UI.el('div', { class: 'backup-banner' }, [
        UI.el('div', { class: 'backup-banner__txt' }, [
          UI.el('div', { text: '💡 ' + head + '，行程和订单只存在本机浏览器' }),
          UI.el('div', { class: 'muted', style: 'font-size:12px;margin-top:2px', text: '换设备 / 清缓存会丢失，去「我的 → 设置 → 导出备份」存一份 JSON' })
        ]),
        UI.el('button', { class: 'btn btn--primary btn--sm', text: '去备份', onclick: () => this.navigate('#/settings') })
      ]);
      main.insertBefore(banner, main.firstChild);
    },

    /* ---------- 顶部栏控制 ---------- */
    setHeaderTitle(t) { document.getElementById('appTitle').textContent = t; },
    setHeaderActions(nodes) {
      const box = document.getElementById('headerActions');
      box.innerHTML = '';
      (nodes || []).forEach(n => box.appendChild(n));
    },
    showBack(show) { document.getElementById('backBtn').hidden = !show; },
    updateFab(section, parts) {
      const fab = document.getElementById('fab');
      if (!fab) return;
      const isTripOrders = section === 'orders' && parts[1] === 'trip' && parts[2];
      if (section === 'trips' || section === 'map') {
        fab.hidden = false; fab.textContent = '＋';
        fab.onclick = () => this.navigate('#/trip/new');
      } else if (isTripOrders) {
        fab.hidden = false; fab.textContent = '＋';
        const tripId = parts[2];
        fab.onclick = () => this.navigate(tripId === 'none' ? '#/orders/new' : '#/orders/new/' + encodeURIComponent(tripId));
      } else if (section === 'orders') {
        fab.hidden = false; fab.textContent = '＋';
        fab.onclick = () => this.navigate('#/orders/new');
      } else {
        fab.hidden = true;
      }
    },
    updateFavicon() {
      const icon = Store.getSettings().appIcon;
      const meta = document.querySelector('meta[name="application-name"]') || document.createElement('meta');
      if (icon) {
        let link = document.querySelector('link[rel="icon"]');
        link.href = icon;
        let apple = document.querySelector('link[rel="apple-touch-icon"]');
        if (apple) apple.href = icon;
      }
    },

    bindChrome() {
      document.getElementById('backBtn').addEventListener('click', () => {
        const hash = location.hash || '';
        if (hash.indexOf('#/trip/') === 0) this.navigate('#/trips');
        else if (hash.indexOf('#/orders/edit/') === 0) this.navigate('#/orders');
        else if (hash.indexOf('#/orders/new') === 0) this.navigate('#/orders');
        else if (hash.indexOf('#/orders/trip/') === 0) this.navigate('#/orders');
        else if (hash.indexOf('/shot') >= 0) this.navigate('#/orders');
        else if (hash === '#/trip/new') this.navigate('#/trips');
        else if (hash === '#/map') this.navigate('#/trips');
        else if (hash === '#/settings') this.navigate('#/trips');
        else history.back();
      });
    },

    navigate(hash) { location.hash = hash; },

    /* ---------- 路由 ---------- */
    render() {
      const main = document.getElementById('appMain');
      const hash = location.hash || '#/trips';
      const path = hash.replace(/^#\//, '');
      const parts = path.split('/');
      this.setHeaderActions([]);

      // 底部导航高亮
      document.querySelectorAll('.nav-item').forEach(n => {
        const r = n.getAttribute('data-route');
        n.classList.toggle('active', r === (parts[0] || 'trips'));
      });

      // 返回按钮
      const needsBack = ['trip/new', 'orders/new'].includes(path) ||
        /^(trip|orders)\/.+/.test(path);
      this.showBack(needsBack);
      this.updateFab(parts[0], parts);

      try {
        if (parts[0] === 'trips' || parts[0] === '') {
          this.setHeaderTitle(Store.getSettings().appName || '小游记');
          Itinerary.tripsView(main);
          this.maybeRemindBackup(main);
        } else if (parts[0] === 'trip' && parts[1] === 'new') {
          this.setHeaderTitle('新建行程');
          Itinerary.newView(main);
        } else if (parts[0] === 'trip' && parts[1]) {
          const t = Store.getTrip(parts[1]);
          this.setHeaderTitle(t ? t.name : '行程');
          this._activeTripId = parts[1];
          Itinerary.detailView(main, parts[1]);
        } else if (parts[0] === 'orders' && (parts[1] === undefined)) {
          this.setHeaderTitle('订单管理');
          Orders.listView(main);
        } else if (parts[0] === 'orders' && parts[1] === 'trip' && parts[2]) {
          const tripId = decodeURIComponent(parts[2]);
          const trip = tripId === 'none' ? null : Store.getTrip(tripId);
          this.setHeaderTitle(trip ? (trip.name || '行程订单') : '未关联订单');
          Orders.tripOrdersListView(main, { tripId });
        } else if (parts[0] === 'orders' && parts[1] === 'new') {
          this.setHeaderTitle('新增订单');
          Orders.formView(main, { tripId: parts[2] ? decodeURIComponent(parts[2]) : null });
        } else if (parts[0] === 'orders' && parts[1] === 'edit' && parts[2]) {
          this.setHeaderTitle('编辑订单');
          Orders.formView(main, { id: parts[2] });
        } else if (parts[0] === 'orders' && parts[2] === 'shot') {
          this.setHeaderTitle('订单截图');
          Orders.shotView(main, parts[1]);
        } else if (parts[0] === 'map') {
          this.setHeaderTitle('地图');
          this.mapView(main);
        } else if (parts[0] === 'settings') {
          this.setHeaderTitle('我的');
          this.settingsView(main);
        } else {
          this.navigate('#/trips');
        }
      } catch (e) {
        console.error(e);
        main.innerHTML = '';
        main.appendChild(UI.el('div', { class: 'card', style: 'text-align:center' }, [
          UI.el('div', { style: 'font-size:40px' }, '😵'),
          UI.el('div', { style: 'font-weight:700;margin:8px 0', text: '页面加载出错' }),
          UI.el('div', { class: 'muted', style: 'font-size:13px', text: String(e && e.message || e) }),
          UI.el('button', { class: 'btn btn--primary mt', text: '回到首页', onclick: () => this.navigate('#/trips') })
        ]));
      }
    },

    /* ---------- 独立地图页 ---------- */
    mapView(main) {
      const trips = Store.getTrips();
      main.innerHTML = '';
      if (!trips.length) {
        main.appendChild(UI.el('div', { class: 'empty' }, [
          UI.el('div', { class: 'empty__emoji', text: '🗺️' }),
          UI.el('div', { text: '还没有行程' }),
          UI.el('div', { class: 'empty__tip', text: '先在攻略里创建行程，再来这里看地图' }),
          UI.el('button', { class: 'btn btn--primary mt', text: '去创建', onclick: () => this.navigate('#/trip/new') })
        ]));
        return;
      }
      let selectedTripId = this._activeTripId || trips[0].id;
      let selectedDay = -1; // -1 = 全部
      let mapMode = 'amap'; // 'amap' | 'sketch'

      const tripChips = UI.el('div', { class: 'chips mb' });
      trips.forEach(t => {
        const c = UI.el('button', { class: 'chip' + (t.id === selectedTripId ? ' active' : ''), text: t.name, onclick: () => { selectedTripId = t.id; selectedDay = -1; updateTripChips(); buildDayChips(); renderMap(); } });
        tripChips.appendChild(c);
      });
      main.appendChild(tripChips);

      const dayChips = UI.el('div', { class: 'chips mb' });
      main.appendChild(dayChips);

      const mapBox = UI.el('div', { class: 'map-box', style: 'height:300px' });
      main.appendChild(mapBox);
      const modeBtn = UI.el('button', { class: 'btn btn--ghost btn--sm', text: '🎨 手绘地图', onclick: () => { mapMode = (mapMode === 'amap' ? 'sketch' : 'amap'); modeBtn.textContent = mapMode === 'amap' ? '🎨 手绘地图' : '🗺️ 高德地图'; renderMap(); } });
      main.appendChild(UI.el('div', { class: 'map-toolbar' }, [
        modeBtn,
        UI.el('button', { class: 'btn btn--ghost btn--sm', text: '🔍 地点搜索', onclick: () => this.searchFromMap(selectedTripId) })
      ]));

      function updateTripChips() {
        Array.from(tripChips.children).forEach(c => {
          c.classList.toggle('active', selectedTripId === c._tripId);
        });
      }
      Array.from(tripChips.children).forEach((c, i) => { c._tripId = trips[i].id; });

      function buildDayChips() {
        dayChips.innerHTML = '';
        const trip = Store.getTrip(selectedTripId);
        const all = UI.el('button', { class: 'chip' + (selectedDay === -1 ? ' active' : ''), text: '全部', onclick: () => { selectedDay = -1; buildDayChips(); renderMap(); } });
        dayChips.appendChild(all);
        (trip.daysData || []).forEach((d, i) => {
          const c = UI.el('button', { class: 'chip' + (selectedDay === i ? ' active' : ''), text: '第' + (i + 1) + '天', onclick: () => { selectedDay = i; buildDayChips(); renderMap(); } });
          dayChips.appendChild(c);
        });
      }

      function renderMap() {
        const trip = Store.getTrip(selectedTripId);
        if (mapMode === 'sketch') {
          MapX.renderSketchMap(mapBox, trip, selectedDay);
          return;
        }
        if (!Store.getSettings().amapKey) {
          mapBox.innerHTML = '';
          mapBox.appendChild(UI.el('div', { class: 'map-box__placeholder' }, [UI.el('div', { style: 'font-size:30px' }, '🔑'), UI.el('div', { text: '在「我的」填入高德 Key 后显示地图' })]));
          return;
        }
        MapX.load(Store.getSettings().amapKey).then(() => {
          mapBox.innerHTML = '';
          const AMap = window.AMap;
          if (selectedDay >= 0) {
            // 按天显示带路线的手绘风格地图
            MapX.renderTripMap(mapBox, trip, selectedDay);
            return;
          }
          // 全部：合并所有天数的点位
          const allPts = [];
          trip.daysData.forEach(d => d.items.forEach(i => { if (i.lng != null) allPts.push(i); }));
          const map = new AMap.Map(mapBox, { zoom: 11, resizeEnable: true, mapStyle: 'amap://styles/whitesmoke' });
          map.addControl(new AMap.Scale());
          if (trip.city) map.setCity(trip.city);
          if (allPts.length) {
            allPts.forEach((p, idx) => {
              const m = new AMap.Marker({ position: [p.lng, p.lat], title: p.title, content: '<div class="amap-route-num">' + (idx + 1) + '</div>' });
              map.add(m);
            });
            map.setFitView(null, false, [60, 60, 60, 60]);
          }
        }).catch(e => {
          mapBox.innerHTML = '';
          mapBox.appendChild(UI.el('div', { class: 'map-box__placeholder' }, [UI.el('div', { text: '地图加载失败：' + (e && e.message || '') })]));
        });
      }
      renderMap();
      this._mapSelected = () => selected;
    },

    searchFromMap(tripId) {
      const trip = Store.getTrip(tripId) || Store.getTrips()[0];
      if (!trip) return;

        } })
      ]);

      // 云同步（GitHub Gist）
      const tokenInput = UI.el('input', { class: 'input', type: 'password', placeholder: 'GitHub Token（需 gist 权限）', value: s.syncToken || '' });
      const gistInput = UI.el('input', { class: 'input', placeholder: '同步仓库 ID（首次上传后自动填，可留空）', value: s.syncGistId || '' });
      const syncStatus = UI.el('div', { class: 'backup-hint', text: (s.lastSyncAt ? ('上次同步：' + UI.fmtDate(s.lastSyncAt)) : '尚未同步') });
      const syncCard = UI.el('div', { class: 'card' }, [
        UI.el('div', { class: 'section-title', text: '☁️ 云同步（多设备共享）' }),
        UI.el('div', { class: 'muted', style: 'font-size:12px;margin-bottom:8px', text: '用你的 GitHub Gist 当云端仓库：手机上传、电脑拉取，反之亦然。Token 只存在本机，需在 GitHub 申请并勾选 gist 权限。' }),
        UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: 'GitHub Token' }), tokenInput,
          UI.el('button', { class: 'btn btn--primary btn--sm mt', text: '保存凭据', onclick: () => {
            Store.saveSettings({ syncToken: tokenInput.value.trim(), syncGistId: gistInput.value.trim() });
            UI.toast('已保存', 'ok');
          } })]),
        UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '同步仓库 ID' }), gistInput]),
        UI.el('div', { class: 'flex' }, [
          UI.el('button', { class: 'btn btn--ghost grow', text: '⬆️ 上传到云端', onclick: async () => {
            syncStatus.textContent = '上传中…';
            try { const id = await Sync.push(); syncStatus.textContent = '已上传 · 仓库 ' + id; UI.toast('已上传到云端', 'ok'); }
            catch (e) { syncStatus.textContent = '上传失败：' + e.message; UI.toast('上传失败：' + e.message, 'error'); }
          } }),
          UI.el('button', { class: 'btn btn--ghost grow', text: '⬇️ 从云端拉取', onclick: async () => {
            syncStatus.textContent = '拉取中…';
            try { await Sync.pull(); syncStatus.textContent = '已拉取 · ' + UI.fmtDate(Store.getLastSyncAt()); UI.toast('已从云端更新', 'ok'); App.render(); }
            catch (e) { syncStatus.textContent = '拉取失败：' + e.message; UI.toast('拉取失败：' + e.message, 'error'); }
          } })
        ]),
        syncStatus
      ]);

      // 安装引导
      let installCard = UI.el('div', {});
      if (this._deferredPrompt) {
        installCard = UI.el('div', { class: 'install-banner' }, [
          UI.el('div', { class: 'install-banner__txt' }, [UI.el('b', { text: '安装到手机桌面' }), UI.el('span', { text: '像 App 一样随时打开' })]),
          UI.el('button', { class: 'btn btn--primary btn--sm', text: '安装', onclick: () => this.doInstall() })
        ]);
      } else if (this.isIOS()) {
        installCard = UI.el('div', { class: 'install-banner' }, [
          UI.el('div', { class: 'install-banner__txt' }, [
            UI.el('b', { text: '添加到主屏幕' }),
            UI.el('span', { text: 'iOS：点 分享 →「添加到主屏幕」' }),
            UI.el('span', { text: 'Android/桌面：浏览器菜单 →「安装应用」' })
          ])
        ]);
      }

      const about = UI.el('div', { class: 'card muted center', style: 'font-size:12px' }, [
        UI.el('div', { style: 'font-size:30px;margin-bottom:4px' }, '🧳'),
        UI.el('div', { text: '小游记 · 自用旅行攻略' }),
        UI.el('div', { text: '纯前端 PWA · 数据存本机 · 可永久托管' }),
        UI.el('div', { class: 'small', style: 'margin-top:6px', text: '构建时间：' + (window.__XIAOYOUJI_BUILD__ || '开发模式') })
      ]);

      main.appendChild(installCard);
      main.appendChild(keyCard);
      main.appendChild(lookCard);
      main.appendChild(dataCard);
      main.appendChild(syncCard);
      main.appendChild(about);
    },

    /* ---------- 安装 PWA ---------- */
    bindInstall() {
      window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this._deferredPrompt = e; });
      window.addEventListener('appinstalled', () => { this._deferredPrompt = null; UI.toast('已安装 🎉', 'ok'); });
    },
    isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent); },
    doInstall() {
      const p = this._deferredPrompt;
      if (!p) return;
      p.prompt();
      p.userChoice.then(() => { this._deferredPrompt = null; });
    },

    registerSW() {
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', () => {
        /* service worker disabled in single-file build */
      });
    }
  };

  global.App = App;
})(window);
</script>
<script>window.addEventListener("load", () => App.init());</script>
</body>
</html>
