  <style>/* ===================== 小游记 · 全局样式 ===================== */
:root {
  --primary: #ff8fab;
  --primary-dark: #f56a8e;
  --primary-soft: #ffe3ec;
  --accent: #7ad0c1;
  --accent-soft: #e2f6f1;
  --warn: #ffb454;
  --bg: #fff6f9;
  --bg-2: #fdeef4;
  --card: #ffffff;
  --text: #3a3340;
  --text-2: #8a8190;
  --line: #f1e3ea;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 6px 20px rgba(255, 143, 171, 0.16);
  --shadow-sm: 0 3px 10px rgba(180, 150, 170, 0.14);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --header-h: 56px;
  --nav-h: 64px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  font-size: 15px;
  line-height: 1.5;
  overscroll-behavior-y: none;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { max-width: 100%; display: block; }
input, select, textarea { font-family: inherit; font-size: 15px; color: var(--text); }
ul { margin: 0; padding: 0; list-style: none; }

#app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; background: var(--bg); position: relative; }

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: #fff;
  padding-top: var(--safe-t);
}
.app-header__inner { height: var(--header-h); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.app-header__title { font-size: 18px; font-weight: 700; margin: 0; flex: 1; letter-spacing: .5px; }
.app-header__actions { display: flex; gap: 6px; }
.app-header__back { color: #fff; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; }
.app-header__back:active { background: rgba(255,255,255,.18); }

.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; color: #fff; }
.icon-btn:active { background: rgba(255,255,255,.2); }
.icon-btn--ghost { background: rgba(255,255,255,.2); }

/* ---------- Main ---------- */
.app-main { flex: 1; padding: 14px 14px calc(var(--nav-h) + var(--safe-b) + 16px); -webkit-overflow-scrolling: touch; }

/* ---------- Bottom Nav ---------- */
.app-nav {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 40;
  width: 100%; max-width: 480px;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(255,255,255,.96);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--line);
  display: flex;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-2); font-size: 11px; position: relative; }
.nav-item__icon { display: flex; }
.nav-item.active { color: var(--primary-dark); font-weight: 700; }
.nav-item.active .nav-item__icon { transform: translateY(-1px); }
.nav-item.active::before { content: ""; position: absolute; top: 6px; width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); z-index: -1; }

/* ---------- Cards ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 14px; margin-bottom: 12px; }
.card--flat { box-shadow: none; border: 1px solid var(--line); }
.section-title { font-size: 16px; font-weight: 700; margin: 4px 0 12px; display: flex; align-items: center; gap: 6px; }
.section-title small { font-weight: 400; color: var(--text-2); font-size: 12px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: 999px; font-weight: 600; font-size: 15px; transition: transform .08s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn--primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: var(--shadow); }
.btn--accent { background: var(--accent); color: #fff; }
.btn--ghost { background: var(--primary-soft); color: var(--primary-dark); }
.btn--line { background: #fff; border: 1.5px solid var(--primary); color: var(--primary-dark); }
.btn--block { width: 100%; }
.btn--sm { padding: 7px 12px; font-size: 13px; }
.btn--danger { background: #ffe5e5; color: #e2575f; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.fab { position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 18px); left: auto; transform: none; z-index: 35; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 8px 22px rgba(245,106,142,.45); display: flex; align-items: center; justify-content: center; font-size: 30px; line-height: 1; }
.fab:active { transform: scale(.94); }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field__label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.input, .select, .textarea {
  width: 100%; border: 1.5px solid var(--line); background: #fff;
  border-radius: var(--radius-sm); padding: 11px 12px; outline: none; transition: border-color .2s;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--primary); }
.textarea { resize: vertical; min-height: 70px; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); color: var(--text-2); font-size: 13px; font-weight: 600; }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: var(--shadow-sm); }

/* ---------- Empty / List ---------- */
.empty { text-align: center; padding: 50px 20px; color: var(--text-2); }
.empty__emoji { font-size: 44px; margin-bottom: 10px; }
.empty__tip { font-size: 13px; margin-top: 6px; }

.trip-card { position: relative; overflow: hidden; cursor: pointer; }
.trip-card__cover { height: 92px; border-radius: 14px; margin: -14px -14px 12px; background: linear-gradient(135deg, var(--primary-soft), var(--accent-soft)); display: flex; align-items: center; justify-content: center; font-size: 40px; }
.trip-card__name { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
.trip-card__meta { color: var(--text-2); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; }
.trip-card__tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--bg-2); color: var(--primary-dark); }
.tag--accent { background: var(--accent-soft); color: #2f9c89; }

.stat-row { display: flex; gap: 10px; }
.stat { flex: 1; background: var(--bg-2); border-radius: var(--radius-sm); padding: 10px; text-align: center; }
.stat__num { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
.stat__lbl { font-size: 11px; color: var(--text-2); }

/* ---------- Timeline ---------- */
.day-block { margin-bottom: 18px; }
.day-head { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.day-head__badge { background: var(--primary); color: #fff; font-weight: 700; border-radius: 10px; padding: 4px 10px; font-size: 13px; }
.day-head__date { color: var(--text-2); font-size: 13px; }

.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--primary-soft), var(--accent-soft)); }
.tl-item { position: relative; margin-bottom: 12px; }
.tl-item__dot { position: absolute; left: -26px; top: 14px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 9px; }
.tl-item__dot--food { border-color: var(--warn); }
.tl-item__dot--transport { border-color: var(--accent); }
.tl-item__dot--hotel { border-color: #9b8cff; }
.tl-item__dot--note { border-color: var(--text-2); }

.item-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 12px; }
.item-card__top { display: flex; align-items: flex-start; gap: 8px; }
.item-card__time { font-weight: 800; color: var(--primary-dark); font-size: 14px; min-width: 46px; }
.item-card__title { font-weight: 700; flex: 1; }
.item-card__type { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary-dark); white-space: nowrap; }
.item-card__type--food { background: #fff2dc; color: #c9822a; }
.item-card__type--transport { background: var(--accent-soft); color: #2f9c89; }
.item-card__type--hotel { background: #efeaff; color: #6a5bd1; }
.item-card__type--note { background: #eee; color: var(--text-2); }
.item-card__note { font-size: 12px; color: var(--text-2); margin-top: 4px; }
.item-card__sub { font-size: 12px; color: var(--text-2); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.item-card__photos { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.item-card__photos img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.item-card__actions { display: flex; gap: 8px; margin-top: 8px; }
.item-card__actions .link { font-size: 12px; color: var(--primary-dark); font-weight: 600; }
.item-card__actions .link--danger { color: #e2575f; }

/* ---------- Map ---------- */
.map-box { width: 100%; height: 260px; border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; background: var(--bg-2); position: relative; }
.map-box__placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-2); gap: 8px; text-align: center; padding: 16px; }
.map-box.inited { background: #fff; }
.map-toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

    renderSketchMap(container, trip, dayIndex) {
      container.classList.add('inited');
      container.innerHTML = '';
      const day = (dayIndex != null && dayIndex >= 0) ? trip.daysData[dayIndex] : null;
      const pool = (day ? day.items : trip.daysData.reduce((a, d) => a.concat(d.items || []), []));
      const pts = pool.filter(i => i.lng != null && i.lat != null && i.lng !== 0 && i.lat !== 0)

      const W = 360, H = 240, P = 38;

      const proj = (lng, lat) => [+(offX + (lng - minX) * scale).toFixed(1), +(offY + (maxY - lat) * scale).toFixed(1)];

      const pinsRough = pts.map((p, i) => {
        const [x, y] = C[i];
        return '<g filter="url(#rough)">' +
          '<circle cx="' + x + '" cy="' + y + '" r="13" fill="#fff" stroke="#ff8fab" stroke-width="3"/>' +
          '<text x="' + x + '" y="' + (y + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="800" fill="#ff5c8a">' + (i + 1) + '</text>' +
          '</g>';

      const labels = pts.map((p, i) => {
        const [x, y] = C[i];

      }).join('');

      const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:16px;background:#fbf3e3">' +
        '<defs><filter id="rough" x="-10%" y="-10%" width="120%" height="120%">' +

    // 路线规划：mode = 'drive' | 'transit'
    async planRoute(container, from, to, mode) {
      const AMap = window.AMap;
      const map = new AMap.Map(container, { zoom: 11, resizeEnable: true });
      if (mode === 'transit') {
        const trans = new AMap.Transfer({ map, city: from.city || '', policy: AMap.TransferPolicy.LEAST_TIME });
        return new Promise((resolve) => {
          trans.search([from.lng, from.lat], [to.lng, to.lat], (status, res) => {
            if (status === 'complete' && res.plans && res.plans.length) {
              const p = res.plans[0];
              resolve('约 ' + (p.time / 60).toFixed(0) + ' 分钟 · ' + (p.distance / 1000).toFixed(1) + ' km · 换乘 ' + (p.transfers || 0) + ' 次');
            } else resolve('未找到公共交通路线');
          });
        });
      } else {
        const driving = new AMap.Driving({ map, policy: AMap.DrivingPolicy.LEAST_TIME });
        return new Promise((resolve) => {
          driving.search([from.lng, from.lat], [to.lng, to.lat], (status, res) => {
            if (status === 'complete' && res.routes && res.routes.length) {
              const r = res.routes[0];
              resolve('驾车约 ' + (r.time / 60).toFixed(0) + ' 分钟 · ' + (r.distance / 1000).toFixed(1) + ' km');
            } else resolve('未找到驾车路线');
          });
        });

    // JSONP 请求（用于高德 Web 服务 REST 接口，跨域、不依赖 JS 插件）
    jsonp(url, ms) {
      return new Promise((resolve, reject) => {
        const cb = 'amapcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
        const s = document.createElement('script');
        const cleanup = () => { clearTimeout(timer); try { delete window[cb]; } catch (e) {} if (s.parentNode) s.parentNode.removeChild(s); };
        const timer = setTimeout(() => { cleanup(); reject(new Error('JSONP TIMEOUT')); }, ms || 12000);
        window[cb] = (data) => { cleanup(); resolve(data); };
        s.onerror = () => { cleanup(); reject(new Error('JSONP LOAD_FAIL')); };
        s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
        document.head.appendChild(s);
      });
    },

    // 高德 Web 服务 REST 搜索（优先）
    async searchRest(key, city, keyword) {
      const out = (raw) => {
        if (!raw) return [];
        if (raw.pois) return raw.pois.filter(p => p.location).map(p => {
          const ll = (p.location || '').split(',');
          return { name: p.name, address: p.address || '', lng: parseFloat(ll[0]), lat: parseFloat(ll[1]), type: p.type || 'poi' };
        });
        if (raw.geocodes) return raw.geocodes.filter(g => g.location).map(g => {
          const ll = (g.location || '').split(',');
          return { name: g.formatted_address || keyword, address: g.formatted_address || '', lng: parseFloat(ll[0]), lat: parseFloat(ll[1]), type: 'geocode' };
        });
        return [];
      };
      const placeUrl = (kw, c) => 'https://restapi.amap.com/v3/place/text?key=' + encodeURIComponent(key) + '&keywords=' + encodeURIComponent(kw) + '&offset=25&output=JSON' + (c ? '&city=' + encodeURIComponent(c) : '');
      const geoUrl = (kw, c) => 'https://restapi.amap.com/v3/geocode/geo?key=' + encodeURIComponent(key) + '&address=' + encodeURIComponent(kw) + '&output=JSON' + (c ? '&city=' + encodeURIComponent(c) : '');
      const tryOnce = async (url) => {
        const d = await this.jsonp(url, 12000);
        if (d.status && d.status !== '1') {
          if (d.infocode === '10001' || (d.info && d.info.indexOf('KEY') >= 0)) throw new Error('KEY_INVALID');
          return [];
        }
        return out(d);
      };
      // POI：城市 → 全国；地理编码：城市 → 全国
      let list = await tryOnce(placeUrl(keyword, city));
      if (!list.length) list = await tryOnce(placeUrl(keyword, ''));
      if (!list.length && city && !keyword.includes(city)) {
        const r = await tryOnce(placeUrl(city + ' ' + keyword, ''));
        if (r.length) list = r;
      }
      if (!list.length) {
        const g = await tryOnce(geoUrl(keyword, city));
        if (g.length) list = g; else list = await tryOnce(geoUrl(keyword, ''));
      }
      return list;
    },

    // 高德 JS API 搜索（兜底）
    async searchJs(city, keyword) {
      const AMap = window.AMap;
      if (!AMap) throw new Error('NO_AMAP');
      const normalize = p => ({ name: p.name, address: p.address, lng: p.location.lng, lat: p.location.lat, type: p.type });
      const withTimeout = (promise, ms, label) => Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' TIMEOUT')), ms))
      ]);
      const placeSearch = (kw, c) => new Promise((resolve, reject) => {
        try {
          const ps = new AMap.PlaceSearch({ city: c || '', pageSize: 20 });
          ps.search(kw, (status, res) => {
            if (status === 'complete' && res.poiList) resolve(res.poiList.pois.map(normalize));
            else resolve([]);
          });
        } catch (e) { reject(e); }
      });
      const geocode = (kw, c) => new Promise((resolve, reject) => {
        try {
          const geo = new AMap.Geocoder({ city: c || '' });
          geo.getLocation(kw, (status, res) => {
            if (status === 'complete' && res.geocodes && res.geocodes.length) {
              resolve(res.geocodes.map(g => ({
                name: g.formattedAddress || kw,
                address: g.formattedAddress || '',
                lng: g.location.lng,
                lat: g.location.lat,
                type: 'geocode'

            } else resolve([]);
          });
        } catch (e) { reject(e); }
      });

        try {
          if (via === 'place') return await withTimeout(placeSearch(kw, c), 12000, 'PlaceSearch');

      let list = await trySearch(keyword, city, 'place');

      if (!list.length && city && !keyword.includes(city)) {

        if (retry !== 'TIMEOUT') list = retry;
      }
      if (!list.length) {
        const g = await trySearch(keyword, city, 'geo');
        if (g === 'TIMEOUT') list = await trySearch(keyword, '', 'geo');
        else list = g;
      }
      return Array.isArray(list) ? list : [];
    },

    async getAdcode(cityName) {

          } else resolve(null);
        });
      });
    }
  };

          const e = polar(cx, cy, r, endDeg);
          const large = (endDeg - startDeg) > 180 ? 1 : 0;
          return 'M ' + cx + ' ' + cy + ' L ' + s.x + ' ' + s.y + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + e.x + ' ' + e.y + ' Z';
        }
        const size = 160;
        const cx = size / 2, cy = size / 2, r = 70;
        const svg = UI.el('svg', { viewBox: '0 0 ' + size + ' ' + size, style: 'width:160px;height:160px;margin:0 auto;display:block' });
        const canvas = UI.el('canvas', { width: size * 2, height: size * 2, style: 'width:160px;height:160px;margin:0 auto;display:none' });
        const cuteFont = '"Nunito", "Quicksand", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';
        const n = catEntries.length;
        let startDeg = 0;
        catEntries.forEach((e, i) => {
          const pct = e.value / dayGrand;
          const endDeg = startDeg + pct * 360;
          const color = BUDGET_COLORS[e.cat] || '#b0a8b8';
          svg.appendChild(UI.el('path', { d: arc(cx, cy, r, startDeg, endDeg), fill: color, stroke: '#fff', 'stroke-width': '2' }));
          if (pct >= 0.05) {
            const midDeg = startDeg + pct * 180;
            const pos = polar(cx, cy, 56, midDeg);
            svg.appendChild(UI.el('text', {
              x: pos.x, y: pos.y, 'text-anchor': 'middle', 'dominant-baseline': 'middle',
              style: 'font-family:' + cuteFont + ';font-size:10px;font-weight:600;fill:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)'
            }, [document.createTextNode(Math.round(pct * 100) + '%')]));
          }
          startDeg = endDeg;
        });
        // 中心镂空成环形图
        svg.appendChild(UI.el('circle', { cx: cx, cy: cy, r: 42, fill: 'var(--card, #ffffff)' }));
        svg.appendChild(UI.el('text', { x: cx, y: cy - 2, 'text-anchor': 'middle', 'dominant-baseline': 'middle', style: 'font-size:11px;fill:var(--text-2)' }, [document.createTextNode('当天总花费')]));
        svg.appendChild(UI.el('text', { x: cx, y: cy + 14, 'text-anchor': 'middle', 'dominant-baseline': 'middle', style: 'font-size:14px;font-weight:700;fill:var(--text)' }, [document.createTextNode(UI.money(dayGrand))]));
        wrap.appendChild(svg);

        // canvas 版本（分享截图用，避免 SVG 渲染异常）
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        let cStart = 0;
        catEntries.forEach((e) => {
          const pct = e.value / dayGrand;
          const end = cStart + pct * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, r, cStart, end);
          ctx.closePath();
          ctx.fillStyle = BUDGET_COLORS[e.cat] || '#b0a8b8';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
          if (pct >= 0.05) {
            const mid = cStart + pct * Math.PI;
            const px = cx + 56 * Math.cos(mid - Math.PI / 2);
            const py = cy + 56 * Math.sin(mid - Math.PI / 2);
            ctx.fillStyle = '#fff';
            ctx.font = '600 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.round(pct * 100) + '%', px, py);
          }
          cStart = end;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, 42, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.fillStyle = '#8a8190';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('当天总花费', cx, cy - 2);
        ctx.fillStyle = '#3a3340';
        ctx.font = '700 14px sans-serif';
        ctx.fillText(UI.money(dayGrand), cx, cy + 14);
        wrap.appendChild(canvas);

        // 图例（按金额从大到小）
        catEntries.forEach(e => {
          const pct = Math.round(e.value / dayGrand * 100);
          const color = BUDGET_COLORS[e.cat] || '#b0a8b8';
          wrap.appendChild(UI.el('div', { class: 'bdg__row' }, [
            UI.el('div', { class: 'bdg__label' }, [
              UI.el('span', { style: 'display:inline-block;width:10px;height:10px;border-radius:50%;background:' + color + ';margin-right:6px' }),
              document.createTextNode(e.label)
            ]),
            UI.el('div', { class: 'bdg__val', text: UI.money(e.value) + ' · ' + pct + '%' })
          ]));
        });
        budgetBox.appendChild(wrap);
      }
    }

    function renderDay() {
      daySection.innerHTML = '';
      const day = trip.daysData[currentDay];
      if (!day) { daySection.appendChild(UI.el('div', { class: 'empty', text: '暂无安排' })); return; }
      sortItems(day);

      const dayCost = day.items.reduce((s, it) => s + effectiveItemBudget(it), 0);
      daySection.appendChild(UI.el('div', { class: 'day-head', style: 'justify-content:space-between' }, [
        UI.el('div', { class: 'flex', style: 'gap:8px;flex-wrap:wrap' }, [
          UI.el('span', { class: 'day-head__badge', text: '第' + (currentDay + 1) + '天' }),
          UI.el('span', { class: 'day-head__date', text: day.date + ' ' + (day.weekday || '') }),
          dayCost > 0 ? UI.el('span', { class: 'tag', style: 'font-weight:700', text: '💰 ' + UI.money(dayCost) }) : null
        ]),
        UI.el('button', { class: 'btn btn--ghost btn--sm', text: '＋ 加安排', onclick: () => editItemModal(trip, currentDay, null, renderDay) })
      ]));

      const tl = UI.el('div', { class: 'timeline' });
      if (!day.items.length) {
        tl.appendChild(UI.el('div', { class: 'muted center', text: '这一天还没有安排，点「＋ 加安排」', style: 'padding:10px' }));
      }
      day.items.forEach(item => tl.appendChild(itemCard(trip, currentDay, item, renderDay)));
      daySection.appendChild(tl);

      renderBudget();
    }

    renderDay();

    // 头部操作：备忘录 / 复制/导出
    App.setHeaderActions([
      UI.el('button', { class: 'icon-btn icon-btn--ghost', title: '打开行程备忘录', html: '📝', onclick: () => { App._memoTripId = id; App.navigate('#/memo'); } }),
      UI.el('button', { class: 'icon-btn icon-btn--ghost', title: '导出/分享', html: '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>', onclick: () => openExportModal(trip) })
    ]);
  }

  function itemCard(trip, dIdx, item, rerender) {
    const meta = TYPE_META[item.type] || { label: '事项', cls: '', icon: '📍' };
    const photod = (item.photos && item.photos.length) ? UI.el('div', { class: 'item-card__photos' }, item.photos.map(p => UI.el('img', { src: p, onclick: (e) => { e.stopPropagation(); previewPhoto(p); } }))) : null;
    const sub = UI.el('div', { class: 'item-card__sub' });
    if (item.place) sub.appendChild(UI.el('span', { text: '📍 ' + item.place }));
    const effBudget = effectiveItemBudget(item);
    if (effBudget > 0) sub.appendChild(UI.el('span', { text: '💰 ' + UI.money(effBudget) }));
    if (item.orderId) {
      const o = Store.getOrder(item.orderId);
      if (o && o.name !== item.place) sub.appendChild(UI.el('span', { text: '🔗 ' + (Orders.CATS[o.category] || {}).icon + o.name }));
    }

    return UI.el('div', { class: 'tl-item' }, [
      UI.el('div', { class: 'tl-item__dot' + (meta.cls ? ' tl-item__dot--' + meta.cls : ''), text: meta.icon }),
      UI.el('div', { class: 'item-card', onclick: () => editItemModal(trip, dIdx, item, rerender) }, [
        UI.el('div', { class: 'item-card__top' }, [
          UI.el('div', { class: 'item-card__time', text: item.time || '' }),
          UI.el('div', { class: 'item-card__title', text: item.title }),
          UI.el('div', { class: 'item-card__type' + (meta.cls ? ' item-card__type--' + meta.cls : ''), text: meta.label })
        ]),
        item.note ? UI.el('div', { class: 'item-card__note', text: item.note }) : null,
        sub.childNodes.length ? sub : null,
        photod,
        UI.el('div', { class: 'item-card__actions' }, [
          UI.el('span', { class: 'link', text: '编辑', onclick: (e) => { e.stopPropagation(); editItemModal(trip, dIdx, item, rerender); } }),
          item.lng != null ? UI.el('span', { class: 'link', text: '导航', onclick: (e) => { e.stopPropagation(); MapX.navigate(item.lng, item.lat, item.title); } }) : null,
          UI.el('span', { class: 'link link--danger', text: '删除', onclick: async (e) => { e.stopPropagation(); if (await UI.confirmDialog({ title: '删除时段', message: '确定删除「' + item.title + '」？', danger: true })) { trip.daysData[dIdx].items = trip.daysData[dIdx].items.filter(x => x.id !== item.id); Store.saveTrip(trip); rerender(); } } })
        ])
      ])
    ]);
  }

  /* ---------------- 编辑/新增时段 ---------------- */
  function editItemModal(trip, dIdx, item, rerender) {
    const isNew = !item;
    const data = item ? JSON.parse(JSON.stringify(item)) : { id: Store.uid('it'), time: '09:00', type: 'attraction', title: '', place: '', lng: null, lat: null, note: '', photos: [], budget: 0, orderId: null };
    const photos = { val: data.photos || [] };

    const typeSel = UI.el('select', { class: 'select' }, Object.keys(TYPE_META).map(k =>
      UI.el('option', { value: k, text: TYPE_META[k].icon + ' ' + TYPE_META[k].label, selected: k === data.type ? 'selected' : null })));
    const timeInput = UI.el('input', { class: 'input', type: 'time', value: data.time || '' });
    const titleInput = UI.el('input', { class: 'input', placeholder: '名称，如：故宫博物院', value: data.title || '' });
    const placeInput = UI.el('input', { class: 'input', placeholder: '地点/地址（选填）', value: data.place || '' });
    const noteInput = UI.el('textarea', { class: 'textarea', placeholder: '备注、Tips（选填）', text: data.note || '' });
    const budgetInput = UI.el('input', { class: 'input', type: 'number', placeholder: '0.00', value: data.budget ? String(data.budget) : '', step: '0.01', min: '0' });

    const orderSel = UI.el('select', { class: 'select' }, [UI.el('option', { value: '', text: '不关联订单', selected: !data.orderId ? 'selected' : null })].concat(
      Store.getOrders().map(o => UI.el('option', { value: o.id, text: (Orders.CATS[o.category] || {}).icon + ' ' + o.name, selected: o.id === data.orderId ? 'selected' : null }))));
    orderSel.onchange = () => {
      const oid = orderSel.value;
      if (!oid) return;
      const o = Store.getOrders().find(x => x.id === oid);
      if (o && o.amount && !budgetInput.value.trim()) budgetInput.value = String(o.amount);
    };

    const grid = UI.el('div', { class: 'photo-grid' });
    function renderPhotos() {
      grid.innerHTML = '';
      photos.val.forEach((p, i) => {
        grid.appendChild(UI.el('div', { style: 'position:relative' }, [
          UI.el('img', { src: p, style: 'width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px', onclick: () => previewPhoto(p) }),
          UI.el('button', { text: '×', style: 'position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font-size:13px', onclick: () => { photos.val.splice(i, 1); renderPhotos(); } })
        ]));
      });
      const add = UI.el('label', { class: 'photo-add', text: '+' });
      const file = UI.el('input', { type: 'file', accept: 'image/*', style: 'display:none', onchange: async (e) => { const f = e.target.files[0]; if (f) { const d = await UI.compressImage(f, 1000); if (d) { photos.val.push(d); renderPhotos(); } } } });
      add.appendChild(file); grid.appendChild(add);
    }
    renderPhotos();

    const body = UI.el('div', {}, [
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '类型' }), typeSel]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '时间' }), timeInput]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '名称' }), titleInput]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '地点' }), placeInput]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '金额（RMB，选填）' }), budgetInput]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '关联订单' }), orderSel]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '照片' }), grid]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '备注' }), noteInput]),
      UI.el('div', { class: 'flex mt' }, [
        isNew ? UI.el('span', {}) : UI.el('button', { class: 'btn btn--danger grow', text: '删除', onclick: async () => { if (await UI.confirmDialog({ title: '删除', message: '确定删除该时段？', danger: true })) { trip.daysData[dIdx].items = trip.daysData[dIdx].items.filter(x => x.id !== data.id); Store.saveTrip(trip); UI.closeModal(); rerender(); } } }),
        UI.el('button', { class: 'btn btn--primary grow', text: isNew ? '添加' : '保存', onclick: () => {
          if (!titleInput.value.trim()) { UI.toast('请填写名称', 'error'); return; }
          const updated = {
            id: data.id, time: timeInput.value || '09:00', type: typeSel.value, title: titleInput.value.trim(),
            place: placeInput.value.trim(), lng: null, lat: null, note: noteInput.value.trim(),
            photos: photos.val, budget: parseFloat(budgetInput.value) || 0, orderId: orderSel.value || null
          };
          const arr = trip.daysData[dIdx].items;
          const idx = arr.findIndex(x => x.id === updated.id);
          if (idx >= 0) arr[idx] = updated; else arr.push(updated);
          sortItems(trip.daysData[dIdx]);
          Store.saveTrip(trip);
          UI.closeModal(); rerender();
        } })
      ])
    ]);
    UI.openModal(isNew ? '＋ 新增安排' : '编辑时段', body);
  }

  /* ---------------- 路线规划 ---------------- */
  function openRouteModal(trip, dIdx) {
    const pts = trip.daysData[dIdx].items.filter(i => i.lng != null && i.lat != null);
    if (pts.length < 2) { UI.toast('当天至少需要 2 个有坐标的地点', 'error'); return; }
    const fromSel = UI.el('select', { class: 'select' }, pts.map((p, i) => UI.el('option', { value: i, text: (i + 1) + '. ' + p.title, selected: i === 0 ? 'selected' : null })));
    const toSel = UI.el('select', { class: 'select' }, pts.map((p, i) => UI.el('option', { value: i, text: (i + 1) + '. ' + p.title, selected: i === pts.length - 1 ? 'selected' : null })));
    let mode = 'drive';
    const seg = UI.el('div', { class: 'seg' }, [
      UI.el('button', { class: 'active', text: '🚗 驾车', onclick: (e) => { mode = 'drive'; seg.querySelectorAll('button').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); } }),
      UI.el('button', { text: '🚌 公交', onclick: (e) => { mode = 'transit'; seg.querySelectorAll('button').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); } })
    ]);
    const resultBox = UI.el('div', { class: 'route-result hidden' });
    const mapBox = UI.el('div', { class: 'map-box', style: 'height:220px' });

    const body = UI.el('div', {}, [
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '起点' }), fromSel]),
      UI.el('div', { class: 'field' }, [UI.el('label', { class: 'field__label', text: '终点' }), toSel]),
      seg,
      UI.el('button', { class: 'btn btn--primary btn--block mt', text: '规划路线', onclick: async () => {
        resultBox.classList.add('hidden');
        const from = pts[+fromSel.value], to = pts[+toSel.value];
        MapX.load(Store.getSettings().amapKey).then(async () => {
          const r = await MapX.planRoute(mapBox, { lng: from.lng, lat: from.lat, city: trip.city }, { lng: to.lng, lat: to.lat }, mode);
          resultBox.textContent = '📏 ' + r;
          resultBox.classList.remove('hidden');
        }).catch(() => UI.toast('地图加载失败', 'error'));
      } }),
      mapBox, resultBox
    ]);
    UI.openModal('路线规划', body);
  }

  /* ---------------- 地点搜索（回调式，可复用） ----------------
     onPick(p) 在选中某个地点时调用，p = { name, address, lng, lat, type }
     弹窗由调用方决定是否关闭 */
  function openSearchModal(trip, onPick) {
    const kwInput = UI.el('input', { class: 'input', placeholder: '搜索地点，如：宽窄巷子' });
    const listBox = UI.el('div', {});
    const body = UI.el('div', {}, [
      UI.el('div', { class: 'flex' }, [
        kwInput,
        UI.el('button', { class: 'btn btn--primary', text: '搜索', onclick: async () => {
          const kw = kwInput.value.trim(); if (!kw) return;
          listBox.innerHTML = '<div class="muted">搜索中…</div>';
          try {
            await MapX.load(Store.getSettings().amapKey);
            const res = await MapX.search(trip.city, kw);
            listBox.innerHTML = '';
            if (!res.length) { listBox.appendChild(UI.el('div', { class: 'muted', text: '未找到结果。可尝试：① 换更常见的地名（如"蛇口邮轮中心"）；② 在关键词前加城市名（如"深圳 蛇口"）；③ 直接手填经纬度。' })); return; }
            res.forEach(p => listBox.appendChild(UI.el('div', { class: 'list-row', onclick: () => {
              onPick(p);
              UI.closeModal();
            } }, [
              UI.el('div', { class: 'list-row__icon', text: '📍' }),
              UI.el('div', { class: 'list-row__body' }, [
                UI.el('div', { class: 'list-row__title', text: p.name }),
                UI.el('div', { class: 'list-row__sub', text: (p.address || '') + (p.lng != null ? '  (' + p.lng + ', ' + p.lat + ')' : '') })
              ])
            ])));
          } catch (e) {
            let msg = '搜索失败';
            if (e && e.message && e.message.includes('SCRIPT_TIMEOUT')) msg = '高德 JS 脚本加载超时，请检查当前网络是否能访问 webapi.amap.com，或稍后重试';
            else if (e && e.message && e.message.includes('KEY_INVALID')) msg = '高德 Key 无效或没有权限。若用的是 Web端 JS API Key，建议再填一个「Web 服务 Key」做搜索（设置页「高德 Web 服务 Key」）。';
            else if (e && e.message && e.message.includes('TIMEOUT')) msg = '高德接口响应超时。建议：① 在设置页填一个「高德 Web 服务 Key」（比 JS API 更稳）；② 检查网络/换 Wi-Fi。';
            else if (e && e.message && e.message.includes('PLUGIN')) msg = '高德插件加载失败，请检查 Key 是否开通了 Web端 JS API';
            else msg = '搜索失败，请检查：① 高德 Key 是否开通了「Web端JS API」和「地点搜索/地理编码」服务；② 当前域名是否在 Key 白名单内。';
            listBox.innerHTML = '<div class="muted">' + msg + '</div>';
          }
        } })
      ]),
      listBox
    ]);
    UI.openModal('地点搜索', body);
  }

  /* ---------------- 导出/分享 ---------------- */
  function buildText(trip) {
    let t = '【' + trip.name + '】\n';
    t += '📍 目的地：' + trip.destination + ' ｜ ' + trip.days + '天 ｜ 人群：' + trip.group + '\n';
    if (trip.preferences && trip.preferences.length) t += '🎯 偏好：' + trip.preferences.join('、') + '\n';
    t += '━━━━━━━━━━━━━━\n';
    trip.daysData.forEach((d, i) => {
      sortItems(d);
      t += '📅 第' + (i + 1) + '天（' + d.date + (d.weekday ? ' ' + d.weekday : '') + '）\n';
      if (!d.items.length) t += '  （自由安排）\n';
      d.items.forEach(it => {
        const m = TYPE_META[it.type] || { label: '事项' };
        t += '  ' + (it.time || '--:--') + ' [' + m.label + '] ' + it.title + (it.place ? '（' + it.place + '）' : '') + '\n';
        if (it.note) t += '      💡 ' + it.note + '\n';
        if (it.budget) t += '      💰 ' + UI.money(it.budget) + '\n';
      });
      t += '\n';
    });
    const items = trip.budgetItems || [];
    const itemSum = items.reduce((s, i) => s + (Number(i.amount) || 0), 0);
    const orders = Store.getOrdersByTrip(trip.id);
    const linked = linkedOrderIds(trip);
    const orderSum = orders.reduce((s, o) => s + (linked.has(o.id) ? 0 : (Number(o.amount) || 0)), 0);
    const TYPE_TO_BUDGET_CAT = { attraction: 'ticket', food: 'food', transport: 'transport', hotel: 'hotel', note: 'other' };
    let itinerarySum = 0;
    (trip.daysData || []).forEach(d => {
      (d.items || []).forEach(it => { itinerarySum += effectiveItemBudget(it); });
    });
    t += '💰 花费汇总：行程 ' + UI.money(itinerarySum) + ' ＋ 手动项次 ' + UI.money(itemSum) + ' ＋ 未关联订单 ' + UI.money(orderSum) + ' ＝ 总花费 ' + UI.money(itinerarySum + itemSum + orderSum) + '\n';
    if (items.length) {
      t += '  手动项次明细：\n';
      items.forEach(i => t += '    · ' + (BUDGET_CATS[i.cat] || {}).icon + ' ' + i.name + ' ' + UI.money(i.amount) + (i.note ? '（' + i.note + '）' : '') + '\n');
    }
    if (orders.length) {
      t += '🧾 订单：\n';
      orders.forEach(o => t += '  · ' + (Orders.CATS[o.category] || {}).icon + ' ' + o.name + ' ' + UI.money(o.amount) + '（' + Orders.PLATFORMS[o.platform] + '）\n');
    }
    t += '\n—— 由「小游记」生成 ——';
    return t;
  }

/* ===================== 云同步（GitHub Gist） ===================== */
(function (global) {
  'use strict';

  const API = 'https://api.github.com/gists';
  const FNAME = 'xiaoyouji.json';

  function cfg() {
    const s = Store.getSettings();
    return {
      token: (s.syncToken || '').trim(),
      gistId: (s.syncGistId || '').trim()
    };
  }
  // 根据 Token 前缀自动选择认证头：
  //   classic PAT（ghp_...）           →  Authorization: token <tok>
  //   fine-grained PAT（github_pat_...）→  Authorization: Bearer <tok>
  function authHeader(token) {
    const t = (token || '').trim();
    if (t.startsWith('github_pat_')) return 'Bearer ' + t;
    return 'token ' + t;
  }
  function hdrs(token) {
    return {
      'Authorization': authHeader(token),
      'Content-Type': 'application/json',
      'Accept': 'application/vnd.github+json'
    };
  }

  // 在用户所有 Gist 中按文件名找到小游记的同步仓库
  async function findGist(token) {
    try {
      const res = await fetch(API, { headers: hdrs(token) });
      if (!res.ok) return null;
      const list = await res.json().catch(() => []);
      const found = (list || []).find(g => g.files && g.files[FNAME]);
      return found ? found.id : null;
    } catch (e) { return null; }
  }

  // 上传本地数据到 Gist（无 gistId 时自动查找已有 / 否则新建）
  async function push() {
    const { token, gistId } = cfg();
    if (!token) throw new Error('请先在同步设置里填写 GitHub Token');
    let id = gistId;
    if (!id) id = await findGist(token);
    const body = JSON.stringify({ files: { [FNAME]: { content: Store.exportJSON() } } });
    let url = API, method = 'POST';
    if (id) { url = API + '/' + id; method = 'PATCH'; }
    const res = await fetch(url, { method, headers: hdrs(token), body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = data.message || res.statusText;
      if (res.status === 401) msg += '。请检查：① Token 是否完整复制（ghp_开头）；② 是否为 Tokens (classic) 且勾选了 gist；③ 是否已被删除/过期。';
      throw new Error('上传失败 (' + res.status + ')：' + msg);
    }
    const newId = data.id || id;
    if (newId && newId !== gistId) Store.saveSettings({ syncGistId: newId });
    Store.saveSettings({ lastSyncAt: Date.now() });
    return newId;
  }

  // 从 Gist 拉取数据覆盖本地（无 gistId 时自动发现）
  async function pull() {
    const { token, gistId } = cfg();
    if (!token) throw new Error('请先在同步设置里填写 GitHub Token');
    let id = gistId;
    if (!id) {
      id = await findGist(token);
      if (!id) throw new Error('还没有同步仓库，请先在一台设备上「上传到云端」一次');
    }
    const res = await fetch(API + '/' + id, { headers: hdrs(token) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      let msg = data.message || res.statusText;
      if (res.status === 401) msg += '。请检查：① Token 是否完整复制（ghp_开头）；② 是否为 Tokens (classic) 且勾选了 gist；③ 是否已被删除/过期。';
      throw new Error('拉取失败 (' + res.status + ')：' + msg);
    }
    const file = data.files && data.files[FNAME];
    if (!file || file.content == null) throw new Error('云端还没有小游记数据');
    Store.importJSON(file.content);
    if (id !== gistId) Store.saveSettings({ syncGistId: id });
    Store.saveSettings({ lastSyncAt: Date.now() });
  }

  global.Sync = { push, pull, findGist, cfg };
})(window);

          Store.saveSettings({ themeColor: c }); Store.applyTheme(); this.updateFavicon(); colorRow.querySelectorAll('.chip').forEach(x => x.textContent = ''); e.target.textContent = '✓';
        } })));
      const nameInput = UI.el('input', { class: 'input', value: s.appName || '小游记', placeholder: 'APP 名称' });
      const iconPreview = UI.el('img', { src: s.appIcon || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIiB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj4KICAgICAgPHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmY4ZmFiIi8+CiAgICAgIDxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iI2Y1NmE4ZSIvPgogICAgPC9saW5lYXJHcmFkaWVudD4KICA8L2RlZnM+CiAgPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjE5MiIgaGVpZ2h0PSIxOTIiIHJ4PSI0MiIgZmlsbD0idXJsKCNnKSIvPgogIDxnIHRyYW5zZm9ybT0idHJhbnNsYXRlKDk2LDEwMCkiPgogICAgPHJlY3QgeD0iLTUyIiB5PSItMzQiIHdpZHRoPSIxMDQiIGhlaWdodD0iNzYiIHJ4PSIxNiIgZmlsbD0iI2ZmZiIvPgogICAgPGxpbmUgeDE9Ii00MiIgeTE9Ii04IiB4Mj0iNDIiIHkyPSItOCIgc3Ryb2tlPSIjZmZhYWJlIiBzdHJva2Utd2lkdGg9IjQiLz4KICAgIDxyZWN0IHg9Ii0xNiIgeT0iLTUwIiB3aWR0aD0iMzIiIGhlaWdodD0iMTgiIHJ4PSI5IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iNiIvPgogICAgPGNpcmNsZSBjeD0iLTE4IiBjeT0iLTgiIHI9IjYiIGZpbGw9IiNmZjhmYWIiLz4KICAgIDxjaXJjbGUgY3g9IjE4IiBjeT0iLTgiIHI9IjYiIGZpbGw9IiNmZjhmYWIiLz4KICAgIDxwYXRoIGQ9Ik0wIDYgTC0xMyAtNiBMLTYgLTE2IEwwIC05IEw2IC0xNiBMMTMgLTYgWiIgZmlsbD0iI2ZmOGZhYiIvPgogIDwvZz4KPC9zdmc+Cg==', style: 'width:60px;height:60px;border-radius:14px;object-fit:cover' });
